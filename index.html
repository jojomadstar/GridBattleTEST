<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>脈息・演武場</title>
    <link rel="icon" href="data:,">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;900&family=Ma+Shan+Zheng&family=Cinzel:wght@600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="shell">
      <section class="stage" aria-label="演武場">
        <canvas id="game" width="1152" height="648"></canvas>
      </section>

      <section class="bottom-hud" aria-label="戰鬥操作">
        <div class="status-panel">
          <div class="class-panel" aria-label="門派選擇">
            <span class="panel-label">門派</span>
            <div class="class-buttons">
              <button class="class-button active" type="button" data-class="tangmen">唐門</button>
              <button class="class-button" type="button" data-class="swordsman">劍客</button>
              <button class="class-button" type="button" data-class="boxer">拳師</button>
            </div>
          </div>

          <div class="meter-block">
            <div class="meter-label">
              <span class="panel-label">氣</span>
              <strong id="chargeText">0%</strong>
            </div>
            <div class="meter">
              <div id="chargeFill" class="meter-fill"></div>
            </div>
          </div>

          <div class="stats">
            <div class="stat stat-self">
              <span class="panel-label">我方</span>
              <strong id="playerHp">135</strong>
            </div>
            <div class="stat stat-foe">
              <span class="panel-label">魔道</span>
              <strong id="enemyHp">600</strong>
            </div>
          </div>
        </div>

        <div class="hand-panel">
          <div class="hand-header">
            <h1>招式手牌</h1>
            <div class="header-actions">
              <button id="mute" type="button" aria-pressed="false">有聲</button>
              <button id="pause" type="button">暫停</button>
              <button id="restart" type="button">重新開始</button>
            </div>
          </div>
          <div id="hand" class="hand"></div>
        </div>

        <details class="legend">
          <summary>心法口訣</summary>
          <div class="legend-content">
            <span>移動 WASD／方向鍵</span>
            <span>普攻 J／Space</span>
            <span>招式 1-4／點擊手牌：第一下瞄準，第二下施放</span>
            <span>取消瞄準 Q／Escape</span>
            <span>暫停 P／Escape　｜　靜音：右上「有聲」鈕</span>
            <span>手機：棋盤滑動移動，點擊普攻</span>
            <span>劍客：浮空後接特定攻擊可加倍擊飛</span>
            <span>拳師：同列普攻自動鎖定敵人左側一格，出拳後返回原位；不同列朝原準心出拳</span>
            <span>拳師：每拳命中集氣 90，落空不集氣</span>
            <span>拳師：百裂崩拳引導 1.6 秒期間無法移動</span>
            <span>魔道會同時放場地攻擊與招式，先讀腳下再讀招</span>
          </div>
        </details>
      </section>
    </main>

    <script src="character-art.js"></script>
    <script src="game.js"></script>
  </body>
</html>
